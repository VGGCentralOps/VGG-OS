{% macro chip(kind, label) -%}
<span class="chip chip-{{ kind }}">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    {%- if kind == 'done' or kind == 'ok' %}<path d="M20 6 9 17l-5-5"/>
    {%- elif kind == 'waiting' or kind == 'warn' %}<path d="M10 5v14M14 5v14"/>
    {%- elif kind == 'moving' %}<path d="m8 5 11 7-11 7V5z"/>
    {%- elif kind == 'review' %}<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 3v18"/>
    {%- elif kind == 'attention' or kind == 'err' %}<path d="M12 3 3 20h18L12 3zM12 10v4M12 17h.01"/>
    {%- elif kind == 'info' %}<path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="9"/>
    {%- else %}<circle cx="12" cy="12" r="6"/>
    {%- endif %}
  </svg>
  {{- label -}}
</span>
{%- endmacro %}

{% macro run_chip(status) -%}
{%- set kind = 'done' if status == 'SUCCEEDED' else ('attention' if status == 'FAILED' else ('moving' if status in ('RUNNING', 'VALIDATED') else 'waiting')) -%}
{{ chip(kind, status) }}
{%- endmacro %}
