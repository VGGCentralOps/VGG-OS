{% macro chip(kind, label) -%}
<span class="chip chip-{{ kind }}">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    {% if kind == 'done' %}<path d="M20 6 9 17l-5-5"/>
    {% elif kind == 'waiting' %}<path d="M10 5v14M14 5v14"/>
    {% elif kind == 'moving' %}<path d="m8 5 11 7-11 7V5z"/>
    {% elif kind == 'review' %}<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 3v18"/>
    {% elif kind == 'attention' %}<path d="M12 3 3 20h18L12 3zM12 10v4M12 17h.01"/>
    {% else %}<circle cx="12" cy="12" r="8"/>
    {% endif %}
  </svg>
  {{ label }}
</span>
{%- endmacro %}
