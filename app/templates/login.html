<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · VGG OS</title>
  <meta name="theme-color" content="#EDF9FD">
  <link rel="icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="auth">
      <section class="auth-card">
        <div class="auth-brand">
          <img class="logo" src="/static/vgg-logo.webp" alt="">
          <h1>VGG OS</h1>
        </div>
        <h2>Sign in</h2>
        <p class="note">Group books and the bank register. The first company to load is Advancly Technologies NIG Ltd. Use the local admin account until appraisal sign-in is ready. Password reset stays on the appraisal site.</p>
        {% if error %}<p class="gate-error">{{ error }}</p>{% endif %}
        <form method="post" action="/api/session" class="stack">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <label>Email <input name="email" type="email" autocomplete="username" required></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
      </section>
  </main>
</body>
</html>
