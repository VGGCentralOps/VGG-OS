<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · VGG OS</title>
  <meta name="theme-color" content="#edf9fd">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/static/favicon.png">
  <script src="/static/theme.js?v=8"></script>
  <link rel="stylesheet" href="/static/app.css?v=8">
  <script src="/static/nav.js?v=8" defer></script>
</head>
<body class="gate">
  <button type="button" class="theme-fab" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
  <div class="gate-shell">
    <section class="gate-hero" aria-label="VGG OS">
      <div class="gate-bubbles" aria-hidden="true">
        <span class="gate-bubble b1"></span>
        <span class="gate-bubble b2"></span>
        <span class="gate-bubble b3"></span>
      </div>
      <div class="gate-mark">
        <img class="logo" src="/static/vgg-logo.webp" alt="Venture Garden Group">
      </div>
      <div class="gate-copy">
        <p class="product">VGG <span>OS</span></p>
        <p class="statement">One place to run the group — books first, then the rest of the stack.</p>
        <p class="aside">Finance is live today. More domains land here as we open them.</p>
      </div>
    </section>

    <section class="gate-panel">
      <main class="auth">
        <section class="auth-card">
          <div class="auth-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09Z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2Z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
          </div>
          <h2>Sign in</h2>
          <p class="auth-lead">Use your Venture Garden credentials to enter VGG OS.</p>
          {% if error %}<p class="gate-error">{{ error }}</p>{% endif %}
          <form method="post" action="/api/session" class="stack" data-signin>
            <input type="hidden" name="csrf_token" value="{{ csrf }}">
            <label>Email
              <span class="field-control">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                <input name="email" type="email" autocomplete="username" required>
              </span>
            </label>
            <label>Password
              <span class="field-control">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input name="password" type="password" autocomplete="current-password" required>
              </span>
            </label>
            <button type="submit" class="btn btn-primary btn-signin" data-busy="Signing in…">
              <span class="btn-idle">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09Z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2Z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
                <span data-label>Sign in</span>
              </span>
              <span class="btn-busy" aria-hidden="true">
                <svg class="spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                <span>Signing in…</span>
              </span>
            </button>
          </form>
          <p class="auth-foot">VGG OS · Venture Garden Group</p>
        </section>
      </main>
    </section>
  </div>
</body>
</html>
