<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VGG OS · Venture Garden Group</title>
  <meta name="description" content="VGG OS is the operating layer for Venture Garden — the shared system of record for company records, decisions, and performance across the group.">
  <meta name="theme-color" content="#edf9fd">
  <meta name="color-scheme" content="light dark">
  <meta name="application-name" content="VGG OS">
  <link rel="canonical" href="https://vggos.vgg.tools/login">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VGG OS">
  <meta property="og:locale" content="en_GB">
  <meta property="og:url" content="https://vggos.vgg.tools/">
  <meta property="og:title" content="VGG OS · Venture Garden Group">
  <meta property="og:description" content="The operating layer for Venture Garden — where company records, decisions, and performance meet.">
  <meta property="og:image" content="https://vggos.vgg.tools/static/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:image:alt" content="VGG OS — Venture Garden Group operating system">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VGG OS · Venture Garden Group">
  <meta name="twitter:description" content="The operating layer for Venture Garden — where company records, decisions, and performance meet.">
  <meta name="twitter:image" content="https://vggos.vgg.tools/static/og.jpg">
  <link rel="icon" href="/static/favicon.png">
  <script src="/static/theme.js?v=16"></script>
  <link rel="stylesheet" href="/static/app.css?v=25">
  <script src="/static/nav.js?v=25" defer></script>
</head>
<body class="gate">
  <div class="gate-shell">
    <section class="gate-hero" aria-label="VGG OS">
      <div class="gate-bubbles" aria-hidden="true">
        <span class="gate-bubble b1"></span>
        <span class="gate-bubble b2"></span>
        <span class="gate-bubble b3"></span>
      </div>
      <div class="gate-copy">
        <p class="product">VGG <span>OS</span></p>
        <p class="statement">The operating layer for Venture Garden — where company records, decisions, and performance meet.</p>
        <p class="aside">One shared system of record across the group.</p>
      </div>
    </section>

    <section class="gate-panel">
      <main class="auth">
        <section class="auth-card">
          <div class="auth-brand">
            <img class="logo" src="/static/vgg-logo.webp" alt="Venture Garden Group">
          </div>
          <h2>Sign in</h2>
          <p class="auth-lead">Sign in with your Venture Garden account.</p>
          {% if error %}<p class="gate-error">{{ error }}</p>{% endif %}
          <form method="post" action="/api/session" class="stack" data-signin>
            <input type="hidden" name="csrf_token" value="{{ csrf }}">
            <label>Email
              <span class="field-control">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                <input name="email" type="email" autocomplete="username" required>
              </span>
            </label>
            <label>Password
              <span class="field-control">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input name="password" type="password" autocomplete="current-password" required>
              </span>
            </label>
            <button type="submit" class="btn btn-primary btn-signin" data-busy="Signing in…">
              <span class="btn-idle">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09Z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2Z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
                <span data-label>Sign in</span>
              </span>
              <span class="btn-busy" aria-hidden="true">
                <svg class="spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                <span>Signing in…</span>
              </span>
            </button>
          </form>
          <p class="auth-foot">VGG OS · Venture Garden Group</p>
        </section>
      </main>
    </section>
  </div>
</body>
</html>
